  <script src="/script.js"></script>
  <script>
    initNav(); initScrollBar(); setActiveNav();
    observeReveal(document.querySelectorAll('.reveal'));

    const INITIAL = 6;
    let allProjects = [], showAll = false;

    (async function() {
      let projects;
      try {
        const r = await fetch('/api/data');
        if (!r.ok) throw 0;
        projects = (await r.json()).projects;
      } catch { projects = []; }

      const grid = document.getElementById('projects-grid');
      const seeAllRow = document.getElementById('see-all-row');
      const seeAllBtn = document.getElementById('see-all-btn');
      if (!grid || !projects?.length) { if (grid) grid.innerHTML = '<p style="color:var(--muted)">No projects yet.</p>'; return; }

      allProjects = projects;
      grid.innerHTML = projects.map((p, i) => buildProjectCard(p, i, true)).join('');
      observeReveal(grid.querySelectorAll('.project-card:not(.hidden)'));

      if (projects.length > INITIAL) {
        seeAllRow?.removeAttribute('hidden');
        const hidden = projects.length - INITIAL;
        if (seeAllBtn) seeAllBtn.textContent = `See ${hidden} more ↓`;
      }

      seeAllBtn?.addEventListener('click', function() {
        if (!showAll) {
          showAll = true;
          grid.querySelectorAll('.project-card.hidden').forEach((c, i) => {
            c.classList.remove('hidden');
            c.style.transitionDelay = `${i * 50}ms`;
            requestAnimationFrame(() => c.classList.add('visible'));
          });
          seeAllBtn.textContent = '↑ Show less';
        } else {
          showAll = false;
          [...grid.querySelectorAll('.project-card')].forEach((c, i) => {
            if (i >= INITIAL) c.classList.add('hidden');
          });
          seeAllBtn.textContent = `See ${allProjects.length - INITIAL} more ↓`;
          document.getElementById('main')?.scrollIntoView({ behavior: 'smooth' });
        }
      });
    })();

    function buildProjectCard(p, i, limit) {
      const hidden = limit && i >= INITIAL ? ' hidden' : '';
      return `
        <a class="project-card reveal${hidden}" href="/project/${p.id}">
          <div class="project-img-wrap">
            <div class="project-placeholder">
              ${p.image ? `<img src="${p.image}" alt="" loading="lazy">` : ''}
            </div>
          </div>
          <div class="project-foot">
            <span class="project-foot-title">${p.title}</span>
            <span class="project-foot-arrow">→</span>
          </div>
        </a>`;
    }
  </script>
