<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Admin — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./admin.css"/>
</head>
<body>

  <!-- ─── LOGIN ──────────────────────────────────────────── -->
  <div id="login-view" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <span class="brand-mark">FW</span>
        <strong>Admin</strong>
      </div>
      <h1>Sign in</h1>
      <p class="login-sub">Portfolio management dashboard</p>

      <form id="login-form" class="login-form" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" name="username" required
            autocomplete="username" spellcheck="false" placeholder="Enter username"/>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" name="password" required
              autocomplete="current-password" placeholder="Enter password"/>
            <button type="button" id="show-password" class="eye-btn" aria-label="Toggle password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="field-error" hidden></div>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign in →</button>
      </form>
    </div>
  </div>

  <!-- ─── DASHBOARD ──────────────────────────────────────── -->
  <div id="dashboard-view" class="dashboard" hidden>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <span class="brand-mark">FW</span>
          <div>
            <strong>Admin</strong>
            <small>Portfolio CMS</small>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-item active" data-tab="projects">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Projects
          </button>
          <button class="nav-item" data-tab="experience">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
            Experience
          </button>
          <button class="nav-item" data-tab="settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </button>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <a href="/" target="_blank" rel="noopener" class="view-site-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
          View site
        </a>
        <button class="logout-btn" id="logout-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    </aside>

    <!-- Main content area -->
    <main class="dash-main">

      <!-- ── PROJECTS TAB ── -->
      <div id="tab-projects" class="tab-panel">
        <div class="panel-header">
          <div>
            <h2>Projects</h2>
            <p>Manage your portfolio projects</p>
          </div>
          <button class="btn btn-primary" id="add-project-btn" type="button">+ Add Project</button>
        </div>
        <div id="projects-list" class="item-list">
          <div class="loading-state">Loading projects…</div>
        </div>
      </div>

      <!-- ── EXPERIENCE TAB ── -->
      <div id="tab-experience" class="tab-panel" hidden>
        <div class="panel-header">
          <div>
            <h2>Work Experience</h2>
            <p>Manage your career history</p>
          </div>
          <button class="btn btn-primary" id="add-exp-btn" type="button">+ Add Experience</button>
        </div>
        <div id="experience-list" class="item-list">
          <div class="loading-state">Loading experience…</div>
        </div>
      </div>

      <!-- ── SETTINGS TAB ── -->
      <div id="tab-settings" class="tab-panel" hidden>
        <div class="panel-header">
          <div>
            <h2>Settings</h2>
            <p>Update your profile &amp; contact info</p>
          </div>
        </div>
        <form id="settings-form" class="settings-form">
          <div class="form-row">
            <div class="field"><label>Full Name</label><input name="name" type="text" required/></div>
            <div class="field"><label>Title</label><input name="title" type="text" required placeholder="e.g. Backend Developer"/></div>
          </div>
          <div class="form-row">
            <div class="field"><label>Subtitle</label><input name="subtitle" type="text" placeholder="e.g. Python · APIs · Automation"/></div>
            <div class="field"><label>Location</label><input name="location" type="text" placeholder="e.g. Paris, France"/></div>
          </div>
          <div class="field full">
            <label>Bio <span class="field-hint">(1–2 sentences)</span></label>
            <textarea name="bio" rows="3" placeholder="Short bio displayed on the portfolio…"></textarea>
          </div>
          <div class="form-row">
            <div class="field"><label>Email</label><input name="email" type="email" required/></div>
            <div class="field">
              <label>Available for Work</label>
              <label class="toggle">
                <input type="checkbox" name="available"/>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span>Show "Available" badge</span>
              </label>
            </div>
          </div>
          <div class="form-row">
            <div class="field"><label>GitHub URL</label><input name="github" type="url" placeholder="https://github.com/…"/></div>
            <div class="field"><label>LinkedIn URL</label><input name="linkedin" type="url" placeholder="https://linkedin.com/in/…"/></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Settings</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- ─── MODAL ─────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title">Add</h3>
        <button class="modal-close" id="modal-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Filled dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="./admin.js"></script>
</body>
</html>
