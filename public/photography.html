  <main id="main" tabindex="-1" class="page-wrap">

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
    <img id="lightbox-img" src="" alt=""/>
  </div>

  <footer class="footer">
    <div class="container footer-inner">
      <a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;" class="back-top">↑ Back to top</a>
    </div>
  </footer>

  <script src="/script.js"></script>
  <script>
    initNav(); initScrollBar(); setActiveNav();
    observeReveal(document.querySelectorAll('.reveal'));

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    function openLightbox(src, alt) {
      lightboxImg.src = src; lightboxImg.alt = alt || '';
      lightbox.classList.add('open');
    }
    function closeLightbox() { lightbox.classList.remove('open'); }

    (async function() {
      const wrap = document.getElementById('photo-grid-wrap');
      let photos;
      try {
        const r = await fetch('/api/photos');
        if (!r.ok) throw 0;
        photos = await r.json();
      } catch { photos = []; }

      if (!photos?.length) {
        wrap.innerHTML = `
          <div class="photo-empty">
            <div class="photo-empty-icon">📷</div>
            <p>No photos yet. Add some from the <a href="/admin" style="color:var(--blue)">admin panel</a>.</p>
          </div>`;
        return;
      }

      wrap.innerHTML = `<div class="photo-grid">${photos.map(p => `
        <div class="photo-item" data-src="${p.url}" data-alt="${p.alt || p.caption || ''}">
          <img src="${p.url}" alt="${p.alt || p.caption || ''}" loading="lazy"/>
          ${p.caption ? `<div class="photo-caption">${p.caption}</div>` : ''}
        </div>`).join('')}</div>`;

      wrap.querySelectorAll('.photo-item').forEach(item => {
        item.addEventListener('click', () => openLightbox(item.dataset.src, item.dataset.alt));
      });
    })();
  </script>
