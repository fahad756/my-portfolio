  <main id="main" tabindex="-1" class="page-wrap">
    <div class="container">
      <a href="/projects" class="back-btn">← All Projects</a>
      <div id="project-content">
        <div class="content-loader">Loading project…</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <a href="/projects" class="back-top">← All Projects</a>
    </div>
  </footer>

  <script src="/script.js"></script>
  <script>
    initNav(); initScrollBar(); setActiveNav();

    (async function() {
      const id = location.pathname.split('/').filter(Boolean).pop();
      const el = document.getElementById('project-content');
      if (!id || !el) return;

      let projects;
      try {
        const r = await fetch('/api/data');
        if (!r.ok) throw 0;
        projects = (await r.json()).projects;
      } catch { projects = []; }

      const project = (projects || []).find(p => p.id === id);

      if (!project) {
        el.innerHTML = `<div class="project-not-found"><h2>Project not found</h2><p>It may have been removed or the URL is incorrect.</p><a href="/projects" class="btn btn-outline" style="margin-top:20px;display:inline-flex">← Back to Projects</a></div>`;
        return;
      }

      document.title = `${project.title} — Fahad Waseem`;

      const idx = projects.indexOf(project);
      const prev = idx > 0 ? projects[idx - 1] : null;
      const next = idx < projects.length - 1 ? projects[idx + 1] : null;
      const longDesc = (project.longDescription || project.description)
        .split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('');

      const heroHtml = project.image
        ? `<div class="pj-hero"><img src="${project.image}" alt="${project.title}" class="pj-hero-img"/></div>`
        : `<div class="pj-hero"><div class="pj-hero-empty">&lt;/&gt;</div></div>`;

      const liveBtn = project.live ? `<a href="${project.live}" target="_blank" rel="noopener" class="btn btn-primary">Live ↗</a>` : '';
      const ghBtn   = project.github ? `<a href="${project.github}" target="_blank" rel="noopener" class="btn btn-outline">Code ↗</a>` : '';

      const navHtml = (prev || next) ? `
        <div class="pj-nav">
          ${prev ? `<a href="/project/${prev.id}" class="pj-nav-link"><span>← Previous</span><span>${prev.title}</span></a>` : '<span></span>'}
          ${next ? `<a href="/project/${next.id}" class="pj-nav-link next"><span>Next →</span><span>${next.title}</span></a>` : '<span></span>'}
        </div>` : '';

      el.innerHTML = `
        <div class="pj-top-row">
          <span class="pj-num">Project ${(idx+1).toString().padStart(2,'0')} / ${projects.length.toString().padStart(2,'0')}</span>
        </div>
        <h1 class="pj-title">${project.title}</h1>
        <div class="pj-meta">
          <div class="tags">${(project.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
          ${liveBtn || ghBtn ? `<div class="pj-btns">${liveBtn}${ghBtn}</div>` : ''}
        </div>
        ${heroHtml}
        <hr class="pj-divider"/>
        <div class="pj-body">${longDesc}</div>
        ${navHtml}
      `;
    })();
  </script>
